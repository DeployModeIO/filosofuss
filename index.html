<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Filosofuss — una colección curada de citas filosóficas inmortales de los grandes pensadores de la historia. Explora la sabiduría eterna."
    />
    <title>Filosofuss — Sabiduría eterna</title>
    <link rel="canonical" href="https://filosofuss.app/" />

    <!-- Open Graph / redes sociales (LinkedIn, X, Facebook…) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Filosofuss" />
    <meta property="og:url" content="https://filosofuss.app/" />
    <meta property="og:title" content="Filosofuss — Sabiduría eterna" />
    <meta
      property="og:description"
      content="Colección curada de citas filosóficas inmortales de los grandes pensadores de la historia. Explora la sabiduría eterna."
    />
    <meta property="og:image" content="https://filosofuss.app/icons/icon-512.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Filosofuss — Sabiduría eterna" />
    <meta
      name="twitter:description"
      content="Colección curada de citas filosóficas inmortales de los grandes pensadores de la historia."
    />
    <meta name="twitter:image" content="https://filosofuss.app/icons/icon-512.png" />

    <!-- PWA: Web App Manifest (ruta relativa para soportar subruta / Capacitor) -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#0a0a0f" />

    <!-- PWA: iOS / Apple (crítico para instalar en iPhone) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Filosofuss" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon.png" />

    <!-- Fuentes self-host (subset latin) — Task B8. @font-face en src/index.css. -->
    <!-- Preload de la cara principal (cita monumental del hero). -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/cormorant-garamond-italic.woff2"
      crossorigin
    />

    <!-- Bloques inline (estilo base y bootstrap de tema): la CSP de nginx
         (Dockerfile -> security-headers.conf) fija sus hashes SHA-256. Si
         editas el bloque style inline o el script de tema, recalcula los
         hashes y actualízalos en el Dockerfile. -->
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        background-color: var(--bg);
      }
      /* Minimal loader shown before React mounts. */
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: var(--bg);
      }
      .spinner {
        width: 44px;
        height: 44px;
        border: 3px solid rgba(201, 169, 106, 0.2);
        border-top-color: #c9a96a;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>

    <script>
      (function(){
        try {
          var raw = localStorage.getItem('filosofuss:theme');
          if (raw) {
            var t = JSON.parse(raw);
            if (t === 'light') {
              document.documentElement.classList.add('light');
            } else if (t === 'paper') {
              document.documentElement.classList.add('paper');
            }
          }
        } catch(e) {}
      })();
    </script>

    <!-- SEO: datos estructurados (Schema.org) con URLs absolutas -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://filosofuss.app/#website",
            "url": "https://filosofuss.app/",
            "name": "Filosofuss",
            "description": "Colección curada de citas filosóficas inmortales de los grandes pensadores de la historia.",
            "inLanguage": "es",
            "publisher": { "@id": "https://filosofuss.app/#website" }
          },
          {
            "@type": "CollectionPage",
            "@id": "https://filosofuss.app/#collection",
            "url": "https://filosofuss.app/",
            "name": "Filosofuss — Sabiduría eterna",
            "description": "Explora citas filosóficas inmortales por autor, era y escuela.",
            "inLanguage": "es",
            "isPartOf": { "@id": "https://filosofuss.app/#website" },
            "about": { "@type": "Thing", "name": "Filosofía" },
            "primaryImageOfPage": {
              "@type": "ImageObject",
              "url": "https://filosofuss.app/icons/icon-512.png"
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root">
      <div id="initial-loader"><div class="spinner"></div></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
