<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Filosofuss — una colección curada de citas filosóficas inmortales de los grandes pensadores de la historia. Explora la sabiduría eterna."
    />
    <title>Filosofuss — Sabiduría eterna</title>

    <!-- Open Graph / redes sociales (LinkedIn, X, Facebook…) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Filosofuss" />
    <meta property="og:title" content="Filosofuss — Sabiduría eterna" />
    <meta
      property="og:description"
      content="Colección curada de citas filosóficas inmortales de los grandes pensadores de la historia. Explora la sabiduría eterna."
    />
    <meta property="og:image" content="https://filosofuss.app/icons/icon-512.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Filosofuss — Sabiduría eterna" />
    <meta
      name="twitter:description"
      content="Colección curada de citas filosóficas inmortales de los grandes pensadores de la historia."
    />
    <meta name="twitter:image" content="https://filosofuss.app/icons/icon-512.png" />

    <!-- PWA: Web App Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0a0a0f" />

    <!-- PWA: iOS / Apple (crítico para instalar en iPhone) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Filosofuss" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon.png" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap"
      rel="stylesheet"
    />

    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        background-color: var(--bg);
      }
      /* Minimal loader shown before React mounts. */
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: var(--bg);
      }
      .spinner {
        width: 44px;
        height: 44px;
        border: 3px solid rgba(201, 169, 106, 0.2);
        border-top-color: #c9a96a;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>

    <script>
      (function(){
        try {
          var raw = localStorage.getItem('filosofuss:theme');
          if (raw) {
            var t = JSON.parse(raw);
            if (t === 'light') {
              document.documentElement.classList.add('light');
            } else if (t === 'paper') {
              document.documentElement.classList.add('paper');
            }
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div id="initial-loader"><div class="spinner"></div></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
